<!DOCTYPE html>
<html lang="en">
  <!-- 
    STUDENT REGISTRATION SYSTEM - JAVASCRIPT DOM MANIPULATION
    Complete implementation with localStorage persistence
    Features: Form validation, Add/Edit/Delete, Responsive design, Badge system
    File Structure: index.html | css/base.css | js/student-form.js
  -->
  <head>
    <!-- Essential meta tags for responsive design and charset -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration System</title>
    
    <!-- External CSS: All styling, responsive breakpoints, badge colors -->
    <link rel="stylesheet" href="./css/base.css" />
  </head>
  
  <body>
    <!-- Main application container with shadow and rounded corners -->
    <div class="container">
      
      <!-- Header Section: Branding and feature summary -->
      <header>
        <h1>Student Registration System</h1>
        <!-- Descriptive subtitle highlighting all key features -->
        <p>
          Modern student enrollment dashboard: Add/Edit/Delete records with
          real-time validation, badge levels (Silver/Gold/Platinum), responsive
          design, and localStorage persistence across sessions.
        </p>
      </header>

      <!-- Form Section: Input fields with validation -->
      <section class="form-section">
        <!-- Main form handles add/edit operations -->
        <form id="studentForm">
          
          <!-- Student Name: Letters only validation -->
          <div>
            <label for="name">Student Name:</label>
            <input type="text" id="name" required />
            <!-- Real-time error display -->
            <div class="error-msg" id="nameError"></div>
          </div>
          
          <!-- Student ID: Numbers only validation -->
          <div>
            <label for="id">Student ID:</label>
            <input type="text" id="id" required />
            <div class="error-msg" id="idError"></div>
          </div>
          
          <!-- Class: Numbers only validation -->
          <div>
            <label for="class">Class:</label>
            <input type="text" id="class" required />
            <div class="error-msg" id="classError"></div>
          </div>
          
          <!-- Badge Level: Dropdown with Silver/Gold/Platinum -->
          <div>
            <label for="badge">Badge Level:</label>
            <select id="badge" required>
              <option value="">Select Badge</option>
              <option value="Silver">Silver</option>
              <option value="Gold">Gold</option>
              <option value="Platinum">Platinum</option>
            </select>
            <div class="error-msg" id="badgeError"></div>
          </div>

          <!-- Email: Email format validation -->
          <div>
            <label for="email">Email ID:</label>
            <input type="email" id="email" required />
            <div class="error-msg" id="emailError"></div>
          </div>
          
          <!-- Contact: 10+ digits validation -->
          <div>
            <label for="contact">Contact Number:</label>
            <input type="tel" id="contact" required />
            <div class="error-msg" id="contactError"></div>
          </div>
          
          <!-- Primary action buttons -->
          <!-- Changes to "Update Student" during edit mode -->
          <button type="submit" id="submitBtn">Add Student</button>
          <!-- Clears form and resets edit mode -->
          <button type="button" class="clear-btn" id="clearBtn">Clear Form</button>
        </form>
      </section>

      <!-- Results Table Section: Displays all records -->
      <section class="table-section">
        <!-- Dynamic table with sticky header and scrollbar -->
        <h2>Registered Students</h2>
        <div id="studentTable">
          <table>
            <!-- Table header: 7 columns for all data + actions -->
            <thead>
              <tr>
                <th>Name</th>
                <th>ID</th>
                <th>Class</th>
                <th>Badge</th>
                <th>Email</th>
                <th>Contact</th>
                <!-- Actions column: Edit/Delete buttons (responsive icons/text) -->
                <th>Actions</th>
              </tr>
            </thead>
            <!-- Body populated by JavaScript: localStorage data -->
            <tbody id="studentTableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

    <!-- JavaScript: Core functionality -->
    <!-- Loads AFTER HTML for DOM access | Handles localStorage persistence -->
    <script src="./js/student-form.js"></script>
  </body>
</html>
